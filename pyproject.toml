[project]
name = "magpylib-studio"
version = "0.1.0"
description = "Headless magpylib editing engine for GUI/LLM frontends (e.g. a VS Code extension backend)."
requires-python = ">=3.11"
# magpylib must currently be the property-tree branch (schema()/set()/observe());
# install it editable: `uv pip install -e ../magpylib`
dependencies = ["plotly>=5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["magpylib_studio"]
