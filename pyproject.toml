[project]
name = "magpylib-studio"
authors = [
  { name = "Alexandre Boisselet", email = "alexabois+magpylib@gmail.com" },
]
description = "Headless magpylib editing engine for GUI/LLM frontends (e.g. a VS Code extension backend)."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]
dynamic = ["version"]
# Works with released magpylib; `magpylib_studio/style_compat.py` fills in the
# style APIs (schema/set/set_values) that only the property-tree branch has.
# That branch additionally enables path-valued properties (current=[...]):
#   pip install "magpylib @ git+https://github.com/magpylib/magpylib@feat/improve-style"
dependencies = ["magpylib>=5.2", "plotly>=5"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/magpylib/magpylib-studio"
"Bug Tracker" = "https://github.com/magpylib/magpylib-studio/issues"

[build-system]
requires = ["hatchling>=1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch]
version.source = "vcs"
build.hooks.vcs.version-file = "magpylib_studio/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["magpylib_studio"]

[tool.ruff.lint]
# Pinned explicitly rather than left to ruff's defaults, which move: v0.15
# reports nothing here and v0.16 reports eleven, so a monthly autoupdate of
# the pre-commit hook would eventually break CI on a rule nobody chose.
select = [
  "E4", "E7", "E9", "F", "W", "I", "UP", "B", "A", "C4", "SIM", "RUF",
  # The code already carries `# noqa: BLE001` / `# noqa: S102`, so these were
  # what it was written against; without them those directives are dead and
  # RUF100 says so.
  "BLE", "S", "TRY",
]
# Typography in prose and error messages: "4×3", "−∞". Deliberate, and the
# ambiguity RUF001 warns about is between glyphs nobody types by accident.
allowed-confusables = ["×", "−"]

ignore = [
  # "Avoid specifying long messages outside the exception class". This engine
  # reports failures *to a user or a model* — "n = 6.5 counts things, so it
  # has to be a whole number" is the feature, not a smell. Fifty of them.
  "TRY003",
  # "Abstract raise to an inner function" / "move this to an else block".
  # Both object to raising and returning inside a `try`, which is precisely
  # how _mutate_doc works: mutate, let anything that fails raise, catch it,
  # restore the previous document and report the error as a string. Rewriting
  # the engine's error model to satisfy a lint is the tail wagging the dog.
  "TRY300",
  "TRY301",
  # "Prefer TypeError for invalid type". These are raised on what a *user*
  # typed into an expression box, where "3 is not a number" is a statement
  # about the value, and every caller catches them the same way regardless.
  "TRY004",
]

[tool.ruff.lint.per-file-ignores]
# A test asserts; that is the whole job.
"tests/*" = ["S101"]
