# Tag a version, get an installable .vsix on the release page — and, once a
# VSCE_PAT repo secret exists (an Azure DevOps PAT scoped to Marketplace >
# Manage, for the registered "magpylib" publisher), a Marketplace publish too.
# Until that secret is added the publish step is skipped, not failed, so this
# workflow works the same either way:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Without VSCE_PAT, a release asset is still the honest channel:
#
#     code --install-extension magpylib-studio-vscode-0.1.0.vsix
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to create the release and attach the .vsix

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level, not step-level: a step's `if` can see the job's `env`, but
    # not the `secrets` context directly, so this is what the Marketplace
    # publish step below checks to decide whether to skip itself.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: pip install -e ".[dev]"

      # Shipping an untested build is the one thing a release must not do.
      - name: Engine tests
        run: python -m pytest -q
      - name: Install
        working-directory: vscode-extension
        run: npm ci
      - name: Integration tests
        working-directory: vscode-extension
        run: xvfb-run -a npm test

      # package.json's version is what vsce embeds in the .vsix, and it does
      # not follow the tag on its own — so a v0.1.0 tag would otherwise still
      # ship a .vsix internally labelled 0.0.1. Marketplace versions can't
      # carry a pre-release suffix, so a v0.1.0rc1-style tag is left alone
      # and the .vsix keeps whatever the last real release set.
      - name: Sync extension version to the release tag
        working-directory: vscode-extension
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            npm version "$version" --no-git-tag-version --allow-same-version
          else
            echo "::notice::${GITHUB_REF_NAME} is a pre-release tag; leaving package.json version as the last synced release"
          fi

      # vsce runs vscode:prepublish, which copies the LICENSE in and compiles.
      - name: Package
        working-directory: vscode-extension
        run: npx @vscode/vsce package --out "${{ github.workspace }}/magpylib-studio-${{ github.ref_name }}.vsix"

      # Skipped (not failed) until VSCE_PAT exists. Gated on a clean tag for
      # the same reason the version sync above is: the Marketplace has no
      # pre-release concept for a normal publish, and re-running this on an
      # rc tag would just try to republish a version already live and fail.
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: vscode-extension
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            npx @vscode/vsce publish --packagePath "${{ github.workspace }}/magpylib-studio-${{ github.ref_name }}.vsix"
          else
            echo "::notice::${GITHUB_REF_NAME} is a pre-release tag; not publishing it to the Marketplace"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: magpylib-studio-*.vsix
          generate_release_notes: true
          body: |
            Install into VS Code:

            ```sh
            code --install-extension magpylib-studio-${{ github.ref_name }}.vsix
            ```

            The extension is the UI only — it drives a Python engine, which
            has to be installed separately into an interpreter it can find:

            ```sh
            pip install "magpylib-studio @ git+https://github.com/magpylib/magpylib-studio.git"
            ```

            Then set `magpylib-studio.pythonPath` to that interpreter.
