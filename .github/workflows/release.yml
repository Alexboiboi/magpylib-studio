# Tag a version, get an installable .vsix on the release page — and, once a
# VSCE_PAT repo secret exists (an Azure DevOps PAT scoped to Marketplace >
# Manage, for the registered "magpylib" publisher), a Marketplace publish too.
# Until that secret is added the publish step is skipped, not failed, so this
# workflow works the same either way:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# Without VSCE_PAT, a release asset is still the honest channel:
#
#     code --install-extension magpylib-studio-vscode-0.1.0.vsix
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create the release and attach the .vsix

jobs:
  release:
    runs-on: ubuntu-latest
    # Job-level, not step-level: a step's `if` can see the job's `env`, but
    # not the `secrets` context directly, so this is what the Marketplace
    # publish step below checks to decide whether to skip itself.
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: pip install -e ".[dev]"

      # The changelog heading is the one thing a release ships that nothing
      # derives from the tag, so it is the one that goes stale silently: both
      # v0.1.0 and v0.1.1 were published with their own notes still sitting
      # under "Unreleased", which is then what the Marketplace listing showed.
      # Checked before the test steps so a mislabelled tag fails in seconds
      # rather than after a full integration run.
      - name: Check the changelog names this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::${GITHUB_REF_NAME} is a pre-release tag; not checking the changelog"
            exit 0
          fi
          declared=$(node -p "require('./vscode-extension/package.json').version")
          if [[ "$declared" != "$version" ]]; then
            echo "::error::vscode-extension/package.json says ${declared} but the tag says ${version}. Bump it in the release prep commit; the sync step below would otherwise paper over this in the runner only."
            exit 1
          fi
          changelog=vscode-extension/CHANGELOG.md
          if ! grep -qF "## [${version}]" "$changelog"; then
            echo "::error::${changelog} has no '## [${version}]' section. Rename the [Unreleased] heading to [${version}], leaving a fresh empty [Unreleased] above it, then move the tag."
            exit 1
          fi
          # A [x.y.z] section that was added *beside* the notes rather than
          # renamed from them ships just as wrong, minus the notes.
          leftovers=$(awk '/^## \[Unreleased\]/{f=1;next} /^## /{f=0} f' "$changelog" | grep -c '[^[:space:]]' || true)
          if [[ "$leftovers" -ne 0 ]]; then
            echo "::error::${changelog} has a [${version}] section but its [Unreleased] section is not empty, so those ${leftovers} lines would ship unmentioned. Move them into [${version}]."
            exit 1
          fi

      # Shipping an untested build is the one thing a release must not do.
      - name: Engine tests
        run: python -m pytest -q
      - name: Install
        working-directory: vscode-extension
        run: npm ci
      - name: Integration tests
        working-directory: vscode-extension
        run: xvfb-run -a npm test

      # package.json's version is what vsce embeds in the .vsix, and it does
      # not follow the tag on its own — so a v0.1.0 tag would otherwise still
      # ship a .vsix internally labelled 0.0.1. Marketplace versions can't
      # carry a pre-release suffix, so a v0.1.0rc1-style tag is left alone.
      #
      # This runs in the runner's checkout and is never committed back, so it
      # cannot be the only place the version is written: v0.1.0, v0.1.0rc2 and
      # v0.1.1 were all tagged with package.json still saying 0.0.1, which is
      # what every local F5 and hand-rolled `vsce package` then produced (and
      # what an rc tag ships, since "left alone" means left at whatever is
      # committed, not at the last release). Bump package.json in the release
      # prep commit alongside the changelog; --allow-same-version then makes
      # this step a no-op that confirms the two agree rather than a silent
      # rewrite that hides them disagreeing.
      - name: Sync extension version to the release tag
        working-directory: vscode-extension
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            npm version "$version" --no-git-tag-version --allow-same-version
          else
            echo "::notice::${GITHUB_REF_NAME} is a pre-release tag; leaving package.json version as the last synced release"
          fi

      # vsce runs vscode:prepublish, which copies the LICENSE in and compiles.
      - name: Package
        working-directory: vscode-extension
        run:
          npx @vscode/vsce package --out "${{ github.workspace
          }}/magpylib-studio-${{ github.ref_name }}.vsix"

      # Skipped (not failed) until VSCE_PAT exists. Gated on a clean tag for
      # the same reason the version sync above is: the Marketplace has no
      # pre-release concept for a normal publish, and re-running this on an
      # rc tag would just try to republish a version already live and fail.
      - name: Publish to the VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: vscode-extension
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            npx @vscode/vsce publish --packagePath "${{ github.workspace }}/magpylib-studio-${{ github.ref_name }}.vsix"
          else
            echo "::notice::${GITHUB_REF_NAME} is a pre-release tag; not publishing it to the Marketplace"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: magpylib-studio-*.vsix
          generate_release_notes: true
          body: |
            Install from the Marketplace:

            ```sh
            code --install-extension magpylib.magpylib-studio-vscode
            ```

            Or from the `.vsix` attached below, which is the same build:

            ```sh
            code --install-extension magpylib-studio-${{ github.ref_name }}.vsix
            ```

            The extension is the UI only — it drives a Python engine. You do
            not have to install that yourself: when it cannot find one, the
            extension offers **Install the Engine**, which sets up an
            interpreter, installs the engine into it and points
            `magpylib-studio.pythonPath` at it.

            To do it by hand instead, into any interpreter >= 3.11:

            ```sh
            pip install magpylib-studio
            ```

            Then set `magpylib-studio.pythonPath` to that interpreter.
